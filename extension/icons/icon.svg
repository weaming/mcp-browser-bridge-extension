<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131D29"/>
      <stop offset="1" stop-color="#0A0F16"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB454"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- 桥面底座(暗) -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- 桥面线 -->
  <rect x="16" y="58" width="96" height="12" rx="6" fill="url(#beam)"/>

  <!-- 左端点:AI(冷青) -->
  <circle cx="26" cy="64" r="12" fill="#7DD3FC"/>
  <circle cx="26" cy="64" r="5" fill="#0A0F16" opacity="0.25"/>

  <!-- 右端点:浏览器(暖白) -->
  <circle cx="102" cy="64" r="12" fill="#FDE68A"/>
  <circle cx="102" cy="64" r="5" fill="#0A0F16" opacity="0.25"/>

  <!-- 桥面高光 -->
  <rect x="16" y="58" width="96" height="4" rx="2" fill="#FFFFFF" opacity="0.35"/>
</svg>
