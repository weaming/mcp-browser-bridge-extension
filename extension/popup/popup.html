<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121a22;
      --panel-2: #0e141b;
      --line: #1e2936;
      --text: #e6edf3;
      --text-dim: #8b98a5;
      --amber: #ffb454;
      --amber-deep: #f59e0b;
      --cyan: #7dd3fc;
      --danger: #ff6b6b;
      --ok: #4ade80;
      --radius: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.5 system-ui, -apple-system, "PingFang SC", sans-serif;
    }

    /* ---------- 头部 ---------- */
    header {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px;
    }
    .brand-mark {
      width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #131d29, #0a0f16);
      border: 1px solid var(--line);
    }
    .brand-mark svg { width: 20px; height: 20px; }
    .brand-name { font-weight: 600; font-size: 14px; letter-spacing: 0.2px; }
    .brand-sub { font-size: 11px; color: var(--text-dim); }
    .conn {
      margin-left: auto; display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--text-dim);
    }
    .conn .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--danger); transition: background 0.3s;
    }
    .conn.on .dot { background: var(--ok); box-shadow: 0 0 6px var(--ok); }

    /* ---------- 控制目标 ---------- */
    .card {
      margin: 0 14px 14px; padding: 10px 12px;
      background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    }
    .card .label {
      font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
      color: var(--text-dim); margin-bottom: 6px;
    }
    .mode-badge {
      float: right; font-size: 9px; padding: 1px 6px; border-radius: 4px;
      border: 1px solid var(--line); color: var(--text-dim);
      text-transform: none; letter-spacing: 0.5px;
    }
    .mode-badge.follow { color: var(--cyan); border-color: rgba(125, 211, 252, 0.4); }
    .mode-badge.fixed { color: var(--amber); border-color: rgba(255, 180, 84, 0.4); }
    .target-box { display: flex; align-items: center; gap: 10px; }
    .favicon {
      width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600;
      background: linear-gradient(135deg, #1b2834, #131d29);
      border: 1px solid var(--line); color: var(--amber);
    }
    .target-title {
      font-weight: 600; font-size: 13px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .target-url {
      font: 11px ui-monospace, SFMono-Regular, monospace; color: var(--text-dim);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .target-empty {
      display: flex; align-items: center; gap: 8px;
      color: var(--text-dim); font-size: 12px;
    }

    .mode-btn {
      margin-top: 10px; width: 100%; padding: 6px;
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--line); border-radius: 7px;
      font-size: 12px; cursor: pointer;
      transition: border-color 0.15s;
    }
    .mode-btn:hover { border-color: var(--amber); }

    /* ---------- 提示 ---------- */
    .notice {
      margin: 10px 14px 14px; padding: 8px 12px;
      font-size: 11px; line-height: 1.5;
      background: rgba(255, 107, 107, 0.08); border: 1px solid rgba(255, 107, 107, 0.3);
      color: #ffb3b3; border-radius: 8px; word-break: break-all;
    }
    .notice.ok { background: rgba(74, 222, 128, 0.08); border-color: rgba(74, 222, 128, 0.3); color: #a7f3c8; }
  </style>
</head>
<body>
  <header>
    <div class="brand-mark" id="brand-mark"></div>
    <div>
      <div class="brand-name">Browser Bridge</div>
      <div class="brand-sub">AI ↔ 浏览器</div>
    </div>
    <div class="conn" id="conn"><span class="dot"></span><span id="conn-text">连接中…</span></div>
  </header>

  <section class="card">
    <div class="label">控制目标 <span class="mode-badge" id="mode-badge"></span></div>
    <div class="target-box" id="target-box"></div>
    <button class="mode-btn" id="mode-btn" hidden></button>
  </section>

  <div class="notice" id="notice" hidden></div>

  <script src="popup.js"></script>
</body>
</html>
